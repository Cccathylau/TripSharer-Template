      const routeEl = document.getElementById('route-view')
      document.querySelectorAll('.poi-mode-text').forEach(t => t.classList.toggle('active', t.dataset.mode === mode))
      if (mode === 'explore') {
        clearRouteHighlight()
        collapseRouteDay()
        const panel = document.getElementById('poi-panel')
        if (panel?.hasAttribute('data-half')) {
          panel.removeAttribute('data-half')
          panel.setAttribute('data-open', '')
        }
        if (filterEl) filterEl.hidden = false
        if (listEl) listEl.hidden = false
        if (routeEl) routeEl.hidden = true
      } else {
        clearAllListHover()
        if (filterEl) filterEl.hidden = true
        if (listEl) listEl.hidden = true
        if (routeEl) { routeEl.hidden = false; buildRouteView() }
        const panel = document.getElementById('poi-panel')
        if (panel?.hasAttribute('data-half')) {
          panel.removeAttribute('data-half')
          panel.setAttribute('data-open', '')
        }
      }
    }

    function updateRouteModeAvailability() {
      if (!mapApi) return
      const hasRoute = mapApi.places.some(p => p.day != null)
      const routeBtn = document.getElementById('route-mode-text')
      if (routeBtn) routeBtn.hidden = !hasRoute
      if (!hasRoute && poiPanelMode === 'route') switchPoiMode('explore')
    }

    function setPoiActiveItem(idx) {
      document.querySelectorAll('.poi-item--active').forEach(el => el.classList.remove('poi-item--active'))
      poiActiveIdx = (idx === -1 || idx == null) ? null : idx
      if (poiActiveIdx !== null) {
        const item = document.querySelector(`.poi-item[data-idx="${idx}"]`)
        if (item) {
          item.classList.add('poi-item--active')
          // 只在面板已展开时滚动定位，避免面板关闭时 scrollIntoView 引发页面横向跳动
          if (document.getElementById('poi-panel')?.hasAttribute('data-open')) {
            item.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
          }
        }
      }
    }

    function buildCategoryFilter() {
      const filterEl = document.getElementById('poi-filter')
      if (!filterEl || !mapApi) return
      const cats = [...new Set(mapApi.places.map(p => p.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'))
      filterEl.innerHTML =
        `<button class="poi-chip active" data-cat="all"><span>全部</span></button>` +
        cats.map(c => `<button class="poi-chip" data-cat="${c}"><span>${c}</span></button>`).join('')
    }

    function buildPoiList(category) {
      poiActiveCat = category
      if (!mapApi) return
      const ul = document.getElementById('poi-list')
      if (!ul) return
      const cityColor = appData?.cityColors?.[mapApi.cityKey] || appData?.theme?.primary || '#E85D4A'
      document.getElementById('poi-panel')?.style.setProperty('--poi-accent', cityColor)
      document.querySelectorAll('.poi-chip').forEach(c => c.classList.toggle('active', c.dataset.cat === category))
      const filtered = mapApi.places
        .map((p, origIdx) => ({ p, origIdx }))
        .filter(({ p }) => category === 'all' || p.category === category)
        .sort((a, b) => a.p.name.localeCompare(b.p.name, 'zh-CN'))
      ul.innerHTML = filtered.length
        ? filtered.map(({ p, origIdx }) =>
          `<li class="poi-item${origIdx === poiActiveIdx ? ' poi-item--active' : ''}" data-idx="${origIdx}">
            <div class="poi-item-name">${p.name}</div>
            ${p.shortNote ? `<div class="poi-item-note">${p.shortNote}</div>` : ''}
            ${p.rating ? `<div class="poi-item-rating" style="color:${cityColor}">★ ${p.rating}</div>` : ''}
          </li>`).join('')
        : `<li class="poi-item-empty">暂无地点</li>`
    }

    function refreshPoiList() { buildPoiList(poiActiveCat); updateRouteModeAvailability() }

    function initPoiPanel() {
      // 触发器：打开 / 关闭切换
      document.getElementById('poi-toggle')?.addEventListener('click', () => {
        const panel = document.getElementById('poi-panel')
        if (panel?.hasAttribute('data-open')) closePoiPanel()
        else { if (!mapApi) return; refreshPoiList(); openPoiPanel() }
      })
      document.getElementById('poi-panel-close')?.addEventListener('click', closePoiPanel)

      // 探索 / 路线模式切换
      document.querySelectorAll('.poi-mode-text').forEach(btn =>
        btn.addEventListener('click', () => switchPoiMode(btn.dataset.mode))
      )

      // category chip 切换（事件委托，支持动态生成的按钮）
      document.getElementById('poi-filter')?.addEventListener('click', e => {
        const chip = e.target.closest('.poi-chip')
        if (!chip) return
        clearAllListHover()
        buildPoiList(chip.dataset.cat)
      })

      const ul = document.getElementById('poi-list')
      if (!ul) return

      // 桌面端：hover 条目时高亮对应 pin
      if (!isPoiTouch) {
        ul.addEventListener('mouseover', e => {
          const item = e.target.closest('.poi-item')
          if (item) document.querySelector(`.pin[data-idx="${item.dataset.idx}"]`)?.classList.add('pin--list-hover')
        })
        ul.addEventListener('mouseout', e => {
          const item = e.target.closest('.poi-item')
          if (item) document.querySelector(`.pin[data-idx="${item.dataset.idx}"]`)?.classList.remove('pin--list-hover')
        })
      }

      // 路线视图：hover/tap 某天高亮对应 pin
      const routeEl = document.getElementById('route-view')
      if (routeEl) {
        if (!isPoiTouch) {
          routeEl.addEventListener('mouseover', e => {
            if (poiActiveIdx !== null) return
            const day = e.target.closest('.route-day')
            if (day) highlightRouteDay(Number(day.dataset.day))
          })
          routeEl.addEventListener('mouseout', e => {
            if (poiActiveIdx !== null) return
            const day = e.target.closest('.route-day')
            if (day) clearRouteHighlight()
          })
          routeEl.addEventListener('click', e => {
            const placeItem = e.target.closest('.route-place-item')
            if (placeItem) {
              const origIdx = parseInt(placeItem.dataset.idx)
              if (poiActiveIdx === origIdx) {
                document.getElementById('place-popup').style.display = 'none'
                document.querySelectorAll('.pin--selected').forEach(el => el.classList.remove('pin--selected'))
                return
              }
              document.querySelectorAll('.route-place-item--active').forEach(el => el.classList.remove('route-place-item--active'))
              placeItem.classList.add('route-place-item--active')
              const place = mapApi.places[origIdx]
              const pinEl = mapApi.mapEl.querySelector(`.pin[data-idx="${origIdx}"]`)
              if (!pinEl) return
              mapApi.zoomToMarker(place._x, place._y, place.clusterId || '')
              showPlacePopup(place, pinEl, mapApi.mapEl, mapApi.getMapVb(), mapApi.SVG_W, mapApi.SVG_H)
              return
            }
            const day = e.target.closest('.route-day')
            if (!day) return
            const dayNum = Number(day.dataset.day)
            const isExpanded = day.querySelector('.route-day-items')
            document.querySelectorAll('.route-day--active').forEach(el => el.classList.remove('route-day--active'))
            if (isExpanded) {
              collapseRouteDay()
              clearRouteHighlight()
              document.getElementById('place-popup').style.display = 'none'
              document.querySelectorAll('.pin--selected').forEach(el => el.classList.remove('pin--selected'))
            } else {
              document.getElementById('place-popup').style.display = 'none'
              document.querySelectorAll('.pin--selected').forEach(el => el.classList.remove('pin--selected'))
              day.classList.add('route-day--active')
              highlightRouteDay(dayNum)
              expandRouteDay(dayNum, day)
            }
          })
        } else {
          routeEl.addEventListener('click', e => {
            const placeItem = e.target.closest('.route-place-item')
            if (placeItem) {
              const origIdx = parseInt(placeItem.dataset.idx)
              if (poiActiveIdx === origIdx) {
                document.getElementById('place-popup').style.display = 'none'
                document.querySelectorAll('.pin--selected').forEach(el => el.classList.remove('pin--selected'))
                return
              }
              document.querySelectorAll('.route-place-item--active').forEach(el => el.classList.remove('route-place-item--active'))
              placeItem.classList.add('route-place-item--active')
              const place = mapApi.places[origIdx]
              const pinEl = mapApi.mapEl.querySelector(`.pin[data-idx="${origIdx}"]`)
              if (!pinEl) return
              mapApi.zoomToMarker(place._x, place._y, place.clusterId || '')
              showPlacePopup(place, pinEl, mapApi.mapEl, mapApi.getMapVb(), mapApi.SVG_W, mapApi.SVG_H)
              return
            }
            const day = e.target.closest('.route-day')
            if (!day) return
            const dayNum = Number(day.dataset.day)
            const panel = document.getElementById('poi-panel')
            const alreadyActive = day.classList.contains('route-day--active')
            document.querySelectorAll('.route-day--active').forEach(el => el.classList.remove('route-day--active'))
            if (alreadyActive) {
              collapseRouteDay()
              clearRouteHighlight()
              document.getElementById('place-popup').style.display = 'none'
              document.querySelectorAll('.pin--selected').forEach(el => el.classList.remove('pin--selected'))
              panel?.removeAttribute('data-half')
              panel?.setAttribute('data-open', '')
            } else {
              day.classList.add('route-day--active')
              document.getElementById('place-popup').style.display = 'none'
              document.querySelectorAll('.pin--selected').forEach(el => el.classList.remove('pin--selected'))
              highlightRouteDay(dayNum, 2.0)
              expandRouteDay(dayNum, day)
              halfOpenPoiPanel()
            }
          })
        }
      }

      // 点击条目：zoom + 打开卡片；再次点击同一条目则关闭并缩回
      ul.addEventListener('click', e => {
        const item = e.target.closest('.poi-item')
        if (!item || !mapApi) return
        const idx = parseInt(item.dataset.idx)
        // 再次点击已选中条目：关卡片并缩回原视图
        if (idx === poiActiveIdx) {
          mapApi.closeMarker()
          setPoiActiveItem(null)
          return
        }
        const place = mapApi.places[idx]
        if (!place) return
        const pinEl = mapApi.mapEl.querySelector(`.pin[data-idx="${idx}"]`)
        if (!pinEl) return
        // 移动端先关面板再 zoom，避免全屏遮住地图
        if (isPoiTouch) closePoiPanel()
        const currentVb = mapApi.getMapVb()
        mapApi.zoomToMarker(place._x, place._y, place.clusterId || '')
        showPlacePopup(place, pinEl, mapApi.mapEl, currentVb, mapApi.SVG_W, mapApi.SVG_H)
      })

      // 弹窗关闭时清除列表 active 状态（零侵入：MutationObserver 监听 style 属性）
      const popup = document.getElementById('place-popup')
      if (popup) {
        new MutationObserver(() => {
          if (popup.style.display === 'none') {
            setPoiActiveItem(null)
            document.querySelectorAll('.route-place-item--active').forEach(el => el.classList.remove('route-place-item--active'))
          }
        }).observe(popup, { attributes: true, attributeFilter: ['style'] })
      }
    }

    async function switchSvgCity(cityKey) {
      closePoiPanel()
      poiPanelMode = 'explore'
      document.querySelectorAll('.poi-mode-text').forEach(t => t.classList.toggle('active', t.dataset.mode === 'explore'))
      const routeEl = document.getElementById('route-view')
      if (routeEl) { routeEl.hidden = true; routeEl.innerHTML = '' }
      document.getElementById('poi-filter')?.removeAttribute('hidden')
      document.getElementById('poi-list')?.removeAttribute('hidden')
      document.getElementById('place-popup').style.display = 'none'
      document.querySelectorAll('.pin--selected').forEach(el => el.classList.remove('pin--selected'))
      await renderCityMapSVG(cityKey)
    }

    function initSvgMap(data, initialCityKey) {
      if (!data) return
      const cities = Object.keys(data.cityNotes)
      const firstKey = initialCityKey || cities[0]
      switchSvgCity(firstKey)
      svgReady = true
    }

    // 初始化应用
    const tripId = getTripId()

    document.getElementById('back-btn').addEventListener('click', () => showScreen('home'))
    initPoiPanel()

    if (!tripId) {
      document.getElementById('trip-title').textContent = '请指定 trip ID（?trip=australia-2026）'
    } else {
      fetch(`data/${tripId}.json`)
        .then(r => r.json())
        .then(data => {
          appData = data
          document.title = data.title || tripId
          document.documentElement.style.setProperty('--primary', data.theme?.primary || '#E85D4A')
          document.getElementById('trip-title').textContent = data.title || tripId
          renderHomeScreen(data)
          // 首屏初始化 back-to-top 监听
          _backToTopListener = () => {
            _backToTopBtn.classList.toggle('visible', window.scrollY > window.innerHeight * 0.7)
          }
          window.addEventListener('scroll', _backToTopListener, { passive: true })
        })
        .catch(() => {
          document.getElementById('trip-title').textContent = `无法加载 ${tripId} 数据`
        })
    }
  </script>
  <button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
</body>
</html>
