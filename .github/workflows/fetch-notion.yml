name: Fetch Notion Data

on:
  workflow_dispatch:
    inputs:
      trip_id:
        description: trips.config.js 中的行程 ID
        required: true
        default: my-trip
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch Notion data
        run: node scripts/fetch-notion.js "$TRIP_ID"
        env:
          TRIP_ID: ${{ inputs.trip_id }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          GAODE_KEY: ${{ secrets.GAODE_KEY }}

      - name: Check fetched data
        env:
          TRIP_ID: ${{ inputs.trip_id }}
        run: node scripts/check-project.js --trip "$TRIP_ID" --stage data

      - name: Commit data files
        env:
          TRIP_ID: ${{ inputs.trip_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update notion data ($TRIP_ID)"
          git push

  deploy:
    needs: fetch
    uses: ./.github/workflows/deploy-gh-pages.yml
    with:
      trip_id: ${{ inputs.trip_id }}
