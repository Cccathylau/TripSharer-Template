name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      trip_id:
        description: trips.config.js 中的行程 ID（留空使用第一个行程）
        required: false
        type: string
  workflow_call:
    inputs:
      trip_id:
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          TRIP_ID: ${{ inputs.trip_id }}
        run: |
          trip_args=()
          if [ -n "$TRIP_ID" ]; then trip_args=(--trip "$TRIP_ID"); fi
          node scripts/check-project.js "${trip_args[@]}" --stage data
          node scripts/build.js "$TRIP_ID"
          node scripts/check-project.js "${trip_args[@]}" --stage build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - uses: actions/deploy-pages@v4
        id: deployment
